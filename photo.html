<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">

        <title>My Photography</title>
        
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                let photos = document.querySelectorAll(".photo");
                let modal = document.querySelector("#imageModal");
                let largeImage = document.querySelector("#largeImage");
                for(let photo of photos)
                {
                    photo.addEventListener("click", function(){
                        largeImage.src = photo.src;
                        modal.style.display = "flex";
                    });

                    modal.addEventListener("click", function(){
                        modal.style.display = "none";
                    });
                } 
            });          
        </script>
    </head>
    <body>
        <div class = "homeFont photoBackground">
            <div class = "textCenter"><h1>photography</h1></div>
            <p id = "photo"></p>
            <nav>
                <ul>

                    <li><a href="index.html">Home</a></li>
                    <li><a href="AboutMe.html">AboutMe</a></li>
                    <li><a href="fantasy.html">Fantasy</a></li>

                </ul>
            </nav>
            <p>
                <div class = "textCenter"><h2>
                    I'm glad to have you here. Here are some photos I’ve taken along the way.
                    I hope you enjoy them as much as I enjoyed capturing them.~
                </h2></div>
            </p>

            <center>
            <img src = "image/photo1.jpeg" alt = "a image" class = "longphoto imgBox1 photo"/>
            <img src = "image/photo5.jpeg" alt = "a image" class = "longphoto imgBox1 photo"/>
            <hr>
            <img src = "image/photo6.jpeg" alt = "a image" class = "longphoto imgBox1 photo" loading="lazy"/>
            <img src = "image/photo11l.jpeg" alt = "a image" class = "longphoto imgBox1 photo" loading="lazy"/>
            <hr>
            <img src = "image/photo4.jpeg" alt = "a image" class = "flatphoto imgBox1 photo" loading="lazy"/>
            <img src = "image/photo2.jpeg" alt = "a image" class = "flatphoto imgBox1 photo" loading="lazy"/>
            <hr>
            <img src = "image/photo3.jpeg" alt = "a image" class = "flatphoto imgBox1 photo" loading="lazy"/>
            <img src = "image/photo7f.jpeg" alt = "a image" class = "flatphoto imgBox1 photo" loading="lazy"/>
            <hr>
            <img src = "image/photo8f.jpeg" alt = "a image" class = "flatphoto imgBox1 photo" loading="lazy"/>
            <img src = "image/photo9f.jpeg" alt = "a image" class = "flatphoto imgBox1 photo" loading="lazy"/>
            <hr>

            <img src = "image/photo12f.jpeg" alt = "a image" class = "flatphoto imgBox1 photo" loading="lazy"/>
            </center>

    </body>
</html>
